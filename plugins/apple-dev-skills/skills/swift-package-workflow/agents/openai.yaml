interface:
  display_name: "Swift Package Workflow"
  short_description: "Compatibility surface that routes broad package work"
  default_prompt: "Use $swift-package-workflow only as a compatibility router when older references still point at that broad package workflow name. Resolve the nearest package root and route by operation into $swift-package-build-run-workflow, $swift-package-testing-workflow, or $swift-package-extension-workflow; use Xcode workflows only for Xcode-owned operations."
